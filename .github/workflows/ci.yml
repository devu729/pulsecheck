name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsecheck
          POSTGRES_PASSWORD: pulsecheck
          POSTGRES_DB: pulsecheck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulsecheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://pulsecheck:pulsecheck@localhost:5432/pulsecheck
      - run: npm test
        env:
          DATABASE_URL: postgres://pulsecheck:pulsecheck@localhost:5432/pulsecheck
